# ============================================================
# AI-improves-itself — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Connecter ce repo sur Render (« New → Blueprint ») crée le
# service automatiquement :
#   1. aiis-core → site statique + API (racine du repo)
#
# (L'ancien service `aiis-scraper` — scraping Chromium via Playwright — a été
# retiré : il ne servait plus. La recherche s'exécute désormais uniquement via
# le notebook Colab, et l'IA « voit » les images grâce à la vision de Mistral.)
#
# ⚠️ Plans — la seule machine GRATUITE de Render est celle de 512 Mo
#    (plan `free` : 512 Mo RAM, 0 $/mois). Tout ce qui est ≥ 1 vCPU / 2 Go
#    est PAYANT, et plus cher que ce qu'on croyait (prix affichés sur
#    render.com/pricing, vérifiés le 2026-09-14) :
#       free        → 512 Mo RAM, 0,1 CPU   0 $/mois   ← utilisé ici
#       0.5c-512mb  → 512 Mo RAM, 0,5 CPU   7 $/mois
#       1c-2g       → 2 Go RAM,   1 CPU    25 $/mois
#       2c-4g       → 4 Go RAM,   2 CPU    85 $/mois
#    (il n'existe AUCUN palier web à 1 Go : l'échelle passe de 512 Mo à 2 Go ;
#    « 0.5c-1g » = plan Postgres, 19 $/mois.)
#    Le service reste donc sur `free` (0 $).
#    Contraintes du plan `free` (docs.render.com/free) : l'instance s'endort
#    après 15 min sans requête entrante (~1 min au réveil), le filesystem est
#    éphémère, pas de disque persistant, pas de SSH, 750 h d'instance gratuites
#    par workspace et par mois.
#    ⚠️ Filesystem éphémère = les JSON locaux sont EFFACÉS à chaque
#    redéploiement/redémarrage → sur Render, brancher le backend GitHub
#    (GITHUB_TOKEN + GITHUB_REPO ci-dessous, voir docs/GITHUB-BACKEND.md) pour
#    que requests / tâches / résultats / knowledge survivent. Les prompts
#    auto-modifiés restent eux éphémères (reset à la version git à chaque
#    redéploiement — garde-fou acceptable : l'humain garde le contrôle).
#
# ⚠️ Specs (vraies erreurs rencontrées, à ne pas reintroduire) :
#    - plan : noms valides pour un web service = `free` ou un « compute
#      flexible » : 0.5c-512mb / 1c-2g / 2c-4g / 2c-8g …
#      (« 0.5c-1g » est un plan **Postgres**, pas un plan web ;
#      « standard-512 » n'est PAS un nom valide.)
#      ⚠️ Ne pas laisser `plan` vide : le défaut Blueprint est 0.5c-512mb
#      (= 7 $/mois), PAS le plan gratuit.
#    - runtime : requis pour tout service (node / python / docker /
#      image / static).
# ============================================================

services:
  # ---------- Site + API (cœur du projet) ----------
  - type: web
    name: aiis-core
    runtime: python
    # free = 512 Mo / 0 $ (seule machine gratuite). Largement suffisant pour
    # FastAPI + le site statique. Passer en 1c-2g (25 $/mois) seulement si besoin.
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn core.server:app --host 0.0.0.0 --port $PORT
    # /health (et PAS /api/status) : sonde légère sans accès réseau/store, pour
    # que le health-check ne dépende jamais de GitHub/Supabase/des providers IA.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Fournisseurs IA (au minimum MISTRAL_API_KEY ; les autres = fallback) ---
      - key: MISTRAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # --- Base de données : backend GitHub (repo privé) — RECOMMANDÉ sur Render ---
      # Sans backend distant, les JSON locaux meurent à chaque redéploiement
      # (filesystem éphémère du plan free). Avec ces 3 vars, tout survit :
      # guide pas-à-pas dans docs/GITHUB-BACKEND.md (token fine-grained =
      # Contents lecture+écriture sur le seul repo de données).
      - key: STORE_BACKEND
        value: auto
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      # --- Emplacement des tâches de recherche dans le repo de données --------
      # Défaut : data/research_tasks.json (avec le reste de la base — le serveur
      # est la source de vérité, Colab passe par l'API). Mettre un autre chemin
      # (ex. "recherche/taches.json") si tu ranges les tâches ailleurs.
      - key: RESEARCH_TASKS_PATH
        sync: false
      # --- Supabase (alternative au backend GitHub ; tant que vides → voir STORE_BACKEND) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # --- URL publique de CE service (utilisée par le notebook Colab pour renvoyer les résultats) ---
      - key: MAIN_SITE_URL
        sync: false
